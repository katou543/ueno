<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>上野ヶ丘交流促進会</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clearBlue: '#F0F7FF',    /* 清楚なベース淡い水色 */
                        schoolNavy: '#1E3A8A',   /* 清潔感のあるネイビー */
                        schoolSky: '#3B82F6',    /* 爽やかな青 */
                        textDark: '#111827'      /* ガッツリ濃い文字色 */
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background-color: #EBF3FC; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .glowing-btn { animation: glow 2s infinite; }
        @keyframes glow {
            0% { box-shadow: 0 0 5px #3b82f6; }
            50% { box-shadow: 0 0 20px #60a5fa; }
            100% { box-shadow: 0 0 5px #3b82f6; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // メインコンポーネント
        const App = () => {
            const [screen, setScreen] = useState('home'); // home, matching, chat, error
            const [myName, setMyName] = useState('');
            const [myIcon, setMyIcon] = useState('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=60'); // 初期値の清楚なイメージ画像

            // 写真変更処理
            const handleIconChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (item) => setMyIcon(item.target.result);
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="max-w-md mx-auto bg-clearBlue min-h-screen shadow-2xl relative overflow-hidden flex flex-col">
                    {screen === 'home' && <HomeScreen setScreen={setScreen} myName={myName} setMyName={setMyName} myIcon={myIcon} handleIconChange={handleIconChange} />}
                    {screen === 'matching' && <MatchingScreen setScreen={setScreen} />}
                    {screen === 'chat' && <ChatScreen setScreen={setScreen} myName={myName} myIcon={myIcon} />}
                    {screen === 'error' && <ErrorScreen setScreen={setScreen} />}
                </div>
            );
        };

        // 1. トップ画面（エントランス）
        const HomeScreen = ({ setScreen, myName, setMyName, myIcon, handleIconChange }) => {
            return (
                <div className="p-6 flex flex-col items-center justify-center my-auto min-h-screen text-center">
                    <h1 className="text-3xl font-extrabold text-schoolNavy mb-3 tracking-wider">上野ヶ丘交流促進会</h1>
                    <p className="text-lg text-gray-700 mb-8 px-2 font-medium leading-relaxed">
                        ここは校内の人とランダムで繋がれる秘密の空間です。<br/>最初は完全匿名なので安心して楽しんでください！
                    </p>

                    <div className="bg-white p-6 rounded-3xl shadow-sm w-full mb-8 border border-blue-100">
                        {/* アイコン選択機能 */}
                        <div className="mb-6 flex flex-col items-center">
                            <span className="text-lg font-bold text-textDark mb-3">プロフィール写真を選択</span>
                            <div className="relative w-28 h-28 rounded-full overflow-hidden border-4 border-schoolSky mb-3 shadow-inner">
                                <img src={myIcon} alt="プロフィール" className="w-full h-full object-cover" />
                            </div>
                            <label className="bg-clearBlue text-schoolSky font-bold text-base px-4 py-2 rounded-full cursor-pointer hover:bg-blue-100 transition">
                                写真フォルダから選ぶ
                                <input type="file" accept="image/*" onChange={handleIconChange} className="hidden" />
                            </label>
                        </div>

                        {/* ニックネーム入力（字を大きめ・濃く設定） */}
                        <div className="text-left">
                            <label className="text-lg font-bold text-textDark block mb-2 pl-1">ニックネーム</label>
                            <input 
                                type="text" 
                                value={myName} 
                                onChange={(e) => setMyName(e.target.value)} 
                                placeholder="名前を入力（本名NG）" 
                                className="w-full text-xl font-bold p-4 border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-schoolSky text-textDark bg-gray-50"
                            />
                        </div>
                    </div>

                    {/* ダミーカウンター */}
                    <div className="text-schoolSky font-bold text-xl mb-8 bg-white px-6 py-3 rounded-full shadow-sm border border-blue-50">
                        ✨ 現在のオンライン人数：<span className="text-2xl font-black text-schoolNavy">142</span> 人
                    </div>

                    {/* 光る開始ボタン */}
                    <button 
                        onClick={() => { if(myName.trim()) setScreen('matching'); else alert('ニックネームを入力してください！'); }}
                        className="w-full glowing-btn bg-schoolSky text-white text-2xl font-black py-5 rounded-2xl shadow-lg hover:bg-blue-600 transition active:scale-95"
                    >
                        マッチングを開始する
                    </button>
                </div>
            );
        };

        // 2. マッチング待機画面
        const MatchingScreen = ({ setScreen }) => {
            const [count, setCount] = useState(10);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCount(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            // 確率でチャット画面かエラー画面に分岐（デモ用に90%で成功）
                            if (Math.random() > 0.1) {
                                setScreen('chat');
                            } else {
                                setScreen('error');
                            }
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [setScreen]);

            return (
                <div className="p-6 flex flex-col items-center justify-center min-h-screen bg-white">
                    <div className="w-20 h-20 border-4 border-schoolSky border-t-transparent rounded-full animate-spin mb-8"></div>
                    <h2 className="text-2xl font-black text-textDark mb-4">通信を確立中...</h2>
                    <p className="text-7xl font-black text-schoolSky mb-8">{count}</p>
                    <p className="text-lg text-gray-600 font-bold text-center leading-relaxed px-4">
                        同時にマッチングを押した校内のユーザーを<br/>
                        <span className="text-schoolNavy font-extrabold text-xl">【確実に2人きり】</span>でペアリングしています。
                    </p>
                </div>
            );
        };

        // 3. リアルタイム・チャット画面
        const ChatScreen = ({ setScreen, myName, myIcon }) => {
            const [timeLeft, setTimeLeft] = useState(600); // 10分 = 600秒
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [showLineArea, setShowLineArea] = useState(false);
            const scrollRef = useRef(null);

            // 初対面へのお題（ランダム）
            const topics = [
                "最近ハマってる動画チャンネルは？",
                "明日地球が滅びるなら最後に何食べる？",
                "校内で一番落ち着くお気に入りの場所は？",
                "テスト勉強っていつもどこでやってる？",
                "最近一番ヘビロテして聴いてる曲教えて！"
            ];
            const randomTopic = useRef(topics[Math.floor(Math.random() * topics.length)]).current;

            // 相手のダミーデータ（清楚なイメージ）
            const partnerName = "匿名うぐいす";
            const partnerIcon = "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=60";

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            setScreen('home');
                            alert('10分が経過したため、通信を安全に切断しました。');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                // 相手からの自動挨拶デモ
                const replyTimer = setTimeout(() => {
                    setMessages([{
                        id: 1,
                        text: "マッチングありがとうございます！よろしくお願いします😊",
                        sender: partnerName,
                        icon: partnerIcon,
                        isMe: false,
                        isStamp: false
                    }]);
                }, 1500);

                return () => { clearInterval(timer); clearTimeout(replyTimer); };
            }, [setScreen]);

            // スクロール自動調整
            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const handleSend = (text, isStamp = false) => {
                if (!text.trim()) return;
                setMessages(prev => [...prev, {
                    id: Date.now(),
                    text: text,
                    sender: myName || "あなた",
                    icon: myIcon,
                    isMe: true,
                    isStamp: isStamp
                }]);
                setInput('');
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            // スタンプリスト
            const stamps = ['👍', '😂', '✨', '🥺', '🎉', '🎵', '👏', '💮'];

            return (
                <div className="flex flex-col h-screen bg-clearBlue">
                    {/* 上部ヘッダー */}
                    <div className="bg-white p-4 shadow-sm border-b border-blue-100 flex justify-between items-center z-10">
                        <button onClick={() => { if(confirm('ルームを退室しますか？')) setScreen('home'); }} className="text-gray-500 font-extrabold text-lg">
                            退室する
                        </button>
                        <div className="text-2xl font-black text-schoolNavy bg-blue-50 px-4 py-1 rounded-full border border-blue-200">
                            残り {formatTime(timeLeft)}
                        </div>
                    </div>

                    {/* 会話のアシストお題 */}
                    <div className="bg-schoolNavy text-white p-3 text-center text-base shadow-inner font-medium">
                        <span className="text-yellow-300 font-bold text-lg">💡 初対面の2人へのお題 💡</span><br/>
                        <span className="text-lg font-bold">{randomTopic}</span>
                    </div>

                    {/* トークエリア（文字サイズ大きめ・スクロール対応） */}
                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 hide-scrollbar flex flex-col space-y-4">
                        {messages.map(m => (
                            <div key={m.id} className={`flex ${m.isMe ? 'justify-end' : 'justify-start'}`}>
                                {!m.isMe && <img src={m.icon} className="w-14 h-14 rounded-full mr-3 border-2 border-white shadow-sm object-cover" />}
                                <div className={`flex flex-col ${m.isMe ? 'items-end' : 'items-start'} max-w-[75%]`}>
                                    {/* 発言者の名前：太字（font-black）で濃い色（text-textDark） */}
                                    <span className="text-base font-black text-textDark mb-1 px-1">{m.sender}</span>
                                    
                                    {m.isStamp ? (
                                        /* 大きなスタンプ表示 */
                                        <div className="text-7xl my-2 p-2 animate-bounce">{m.text}</div>
                                    ) : (
                                        /* 通常テキスト */
                                        <div className={`p-4 rounded-2xl text-xl font-bold leading-relaxed shadow-sm ${m.isMe ? 'bg-schoolSky text-white rounded-tr-none' : 'bg-white text-textDark rounded-tl-none border border-blue-100'}`}>
                                            {m.text}
                                        </div>
                                    )}
                                </div>
                                {m.isMe && <img src={m.icon} className="w-14 h-14 rounded-full ml-3 border-2 border-white shadow-sm object-cover" />}
                            </div>
                        ))}
                    </div>

                    {/* 連絡先交換の隠しエリア */}
                    {showLineArea && (
                        <div className="bg-white p-4 border-t-2 border-blue-200 flex gap-2 animate-slide-up">
                            <input 
                                type="text" 
                                placeholder="LINEのIDやURLを入力してください" 
                                id="lineInput"
                                className="flex-1 p-3 rounded-xl border-2 border-blue-200 text-lg font-bold text-textDark focus:outline-none focus:border-schoolSky"
                            />
                            <button 
                                onClick={() => {
                                    const val = document.getElementById('lineInput').value;
                                    if(val.trim()) {
                                        handleSend(`🔒【限定公開連絡先】\n${val}`);
                                        setShowLineArea(false);
                                    }
                                }}
                                className="bg-schoolNavy text-white px-5 rounded-xl font-black text-lg"
                            >
                                送信
                            </button>
                        </div>
                    )}

                    {/* ボトム操作・入力エリア */}
                    <div className="bg-white p-4 border-t border-blue-100 shadow-xl">
                        {/* 上段：交換ボタン ＆ スタンプパレット */}
                        <div className="flex flex-col gap-3 mb-3">
                            <div className="flex justify-between items-center">
                                <button 
                                    onClick={() => setShowLineArea(!showLineArea)} 
                                    className="bg-yellow-400 text-textDark text-base font-black px-4 py-2 rounded-full shadow-sm hover:bg-yellow-500 transition"
                                >
                                    🤝 連絡先を交換する
                                </button>
                                <span className="text-sm font-bold text-gray-400 mr-2">スタンプをタップで送信↓</span>
                            </div>
                            
                            {/* 横スクロールスタンプリスト */}
                            <div className="flex gap-3 overflow-x-auto py-1 px-2 bg-clearBlue rounded-xl hide-scrollbar">
                                {stamps.map(s => (
                                    <button 
                                        key={s} 
                                        onClick={() => handleSend(s, true)} 
                                        className="text-4xl hover:scale-125 transition active:scale-95 duration-100"
                                    >
                                        {s}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 下段：テキスト入力 */}
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={input} 
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && handleSend(input)}
                                placeholder="メッセージを入力..." 
                                className="flex-1 bg-gray-100 p-4 rounded-2xl text-xl font-bold text-textDark focus:outline-none focus:bg-blue-50/50"
                            />
                            <button 
                                onClick={() => handleSend(input)} 
                                className="bg-schoolSky text-white px-6 font-black rounded-2xl text-xl active:scale-95 transition"
                            >
                                送信
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. エラー・満席画面
        const ErrorScreen = ({ setScreen }) => (
            <div className="p-6 flex flex-col items-center justify-center my-auto min-h-screen text-center bg-white">
                <div className="text-7xl mb-6 animate-bounce">😥</div>
                <h2 className="text-2xl font-black text-textDark mb-4 px-2">現在、他の交流ルームが満席です</h2>
                <p className="text-xl text-gray-600 mb-8 font-bold leading-relaxed px-4">
                    時間を変えて<br/>
                    <span className="text-schoolSky font-black">（放課後16:30〜や夜21:00〜がおすすめ！）</span><br/>
                    もう一度試してみてね！
                </p>
                <button 
                    onClick={() => setScreen('home')} 
                    className="w-full bg-gray-500 text-white text-xl font-black py-4 px-8 rounded-2xl shadow-md hover:bg-gray-600 transition"
                >
                    トップに戻る
                </button>
            </div>
        );

        // Reactマウント
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
